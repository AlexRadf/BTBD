<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <filter id="fibers">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.04" numOctaves="2" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.27  0 0 0 0 0.16  0 0 0 0.55 -0.12"/>
  </filter>
  <filter id="speckle">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="9" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0 0.12  0 0 0 1.4 -0.85"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#fibers)" opacity="0.35"/>
  <rect width="100%" height="100%" filter="url(#speckle)" opacity="0.5"/>
</svg>
