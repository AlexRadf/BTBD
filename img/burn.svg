      <feDisplacementMap in="SourceGraphic" scale="8"/>
    </filter>
    <radialGradient id="scorch">
      <stop offset="0.35" stop-color="#2a1608" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#5a3010" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7a4a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g filter="url(#r)">
    <circle cx="30" cy="30" r="22" fill="url(#scorch)"/>
    <circle cx="30" cy="30" r="7" fill="#0c0d10"/>
  </g>
</svg>
