<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <filter id="wobble" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="10"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="14"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <g filter="url(#soft)">
    <circle cx="120" cy="120" r="84" fill="#7a4a22" fill-opacity="0.07"/>
  </g>
  <g filter="url(#wobble)" fill="none" stroke="#6b3d1a">
