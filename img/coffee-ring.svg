    <circle cx="120" cy="120" r="82" stroke-width="1.5" stroke-opacity="0.25"/>
    <path d="M44 150 A86 86 0 0 0 170 192" stroke-width="8" stroke-opacity="0.22" stroke-linecap="round"/>
    <path d="M196 80 A86 86 0 0 0 150 40" stroke-width="5" stroke-opacity="0.18" stroke-linecap="round"/>
  </g>
  <g filter="url(#wobble)" fill="#6b3d1a">
    <circle cx="214" cy="168" r="4" fill-opacity="0.25"/>
    <circle cx="224" cy="150" r="2" fill-opacity="0.2"/>
    <circle cx="30" cy="96" r="2.5" fill-opacity="0.18"/>
  </g>
</svg>
